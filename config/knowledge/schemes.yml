    conditions:
      - field: punjab_resident
        operator: eq
        value: true
        description: You are a resident of Punjab (with Punjab Aadhaar and voter ID).

  - slug: pb-sc-direct-loan
    name: Direct Loan Scheme (Punjab SC Finance Corporation)
    name_pa: ਸਿੱਧਾ ਕਰਜ਼ਾ ਸਕੀਮ (ਪੰਜਾਬ ਅਨੁਸੂਚਿਤ ਜਾਤੀਆਂ ਵਿੱਤ ਕਾਰਪੋਰੇਸ਼ਨ)
    department: PB_SCFC
