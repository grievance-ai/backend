  - slug: pb-mukh-mantri-sehat-yojana
    name: Mukh Mantri Sehat Yojana
    short_name: MMSY
    name_pa: ਮੁੱਖ ਮੰਤਰੀ ਸਿਹਤ ਯੋਜਨਾ
    department: PB_SHA
    level: state
    state_code: PB
    description: >-
      Cashless hospital treatment for every Punjab family, including government
      employees and pensioners. No income limit.
    benefits: >-
      Cashless treatment of up to Rs 10 lakh per family per year at empanelled
      government and private hospitals in Punjab, covering more than 2,000
      treatment packages.
    required_documents:
      - Aadhaar card of each family member
      - Voter ID card
    application_steps:
      - Go to your nearest Common Service Centre (CSC) with the identity documents of all family members.
      - Registration is confirmed at once by SMS.
      - Your Sehat Card is given at the CSC within 2-3 weeks. You can also download it from the State Health Agency website.
