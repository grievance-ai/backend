    conditions:
      - field: has_girl_child_below_10
        operator: eq
        value: true
        description: You are the parent or guardian of a girl below 10 years of age.

  - slug: pm-mudra
    name: Pradhan Mantri MUDRA Yojana
    short_name: PMMY
    name_pa: ਪ੍ਰਧਾਨ ਮੰਤਰੀ ਮੁਦਰਾ ਯੋਜਨਾ
    department: FINANCE
    level: central
    description: >-
      Bank loans without collateral for small and micro businesses in
      manufacturing, trading and services, including activities allied to
      farming like dairy, poultry and beekeeping.
    benefits: >-
      Four loan sizes: Shishu up to Rs 50,000; Kishor Rs 50,000 to Rs 5 lakh;
      Tarun Rs 5 lakh to Rs 10 lakh; Tarun Plus Rs 10 lakh to Rs 20 lakh (only
      for those who repaid an earlier Tarun loan).
    required_documents:
      - Aadhaar card
      - Business plan or proof of business
      - Bank account details
