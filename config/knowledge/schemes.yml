# Scheme knowledge base — the ONLY source the assistant may answer from.
#
# NOT YET VERIFIED BY A PERSON. The first six are a starter set; the rest (added
# 30 Oct 2026) were written from official sources only: the Punjab department
# sites, the Punjab Social Justice department's 2026 schemes brochure, central
# scheme portals, and pib.gov.in. Each one's `source_url` is where its facts came
# from. Before the demo, check each against its source, fix anything outdated,
# then set last_verified_on to the date you checked it.
#
# Load / update (idempotent, upserts by slug):
#   docker compose run --rm api python -m app.console seed-knowledge
#
# Source (optional per scheme): `source_name` and `source_url` say where the text
# came from (credit myScheme prominently if its text is reused). `review_status`
# is derived: needs_review until `last_verified_on` is set, then verified.
#
# Eligibility conditions: `field` names that match a citizen profile attribute
# (occupation, land_holding_acres, income_band, social_category, gender, age)
# are checked against the profile; any other field (e.g. owns_pucca_house) is
# asked for in the conversation. Conditions sharing a `group` are "any of".

