    conditions:
      - field: age
        operator: gte
        value: 18
        description: You are 18 or older.
      - field: age
        operator: lte
        value: 40
        description: You are 40 or younger when you join.
      - field: income_tax_payer
        operator: eq
        value: false
        description: You do not pay income tax (income tax payers cannot join since 1 October 2022).

  - slug: pmjdy
