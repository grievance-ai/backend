        description: You are between 18 and 55 years of age.
      - field: age
        operator: lte
        value: 55
        description: You are 55 or younger.
      - field: annual_income_rupees
        operator: lte
        value: 300000
        description: Your annual income is Rs 3 lakh or less.

  - slug: pb-ambedkar-coaching
