schemes:
  - slug: pm-kisan
    name: Pradhan Mantri Kisan Samman Nidhi
    short_name: PM-KISAN
    name_pa: ਪ੍ਰਧਾਨ ਮੰਤਰੀ ਕਿਸਾਨ ਸਨਮਾਨ ਨਿਧੀ
    department: AGRICULTURE
    level: central
    description: >-
      Income support for landholding farmer families, paid directly into their
      bank account.
    benefits: >-
      Rs 6,000 per year, paid in three equal instalments of Rs 2,000 directly to
      the farmer's Aadhaar-linked bank account.
    required_documents:
      - Aadhaar card
      - Land ownership records
      - Aadhaar-linked bank account details
    application_steps:
      - Register on the PM-KISAN portal using "New Farmer Registration", or visit a Common Service Centre (CSC).
      - Enter your Aadhaar, land and bank details.
      - Your land records are verified by the state government.
      - Complete eKYC (mandatory) to keep receiving instalments.
    application_mode: online or CSC
    official_url: https://pmkisan.gov.in/
    contact: PM-KISAN helpline 155261
    category_tags: [agriculture, income-support]
    keywords: [farmer, kisan, agriculture, income, ਕਿਸਾਨ, ਖੇਤੀ, ਕਿਸਾਨ ਸਨਮਾਨ ਨਿਧੀ]
    conditions:
      - field: occupation
        operator: eq
        value: farmer
        description: You are a farmer.
      - field: land_holding_acres
        operator: gt
        value: 0
        description: Your family owns cultivable land in its name.
      - field: income_tax_payer
        operator: eq
        value: false
        description: No family member paid income tax in the last assessment year.
      - field: govt_employee_or_professional
        operator: eq
        value: false
        description: >-
          No family member is a serving or retired government employee (other
          than Group D / MTS), a registered professional (doctor, engineer,
          lawyer, chartered accountant), or a pensioner getting Rs 10,000 or
          more per month.

  - slug: pmay-g
    name: Pradhan Mantri Awas Yojana - Gramin
    short_name: PMAY-G
    name_pa: ਪ੍ਰਧਾਨ ਮੰਤਰੀ ਆਵਾਸ ਯੋਜਨਾ - ਗ੍ਰਾਮੀਣ
    department: RURAL_DEVELOPMENT
    level: central
    description: >-
      Financial help for houseless rural families, or families living in kutcha
      or dilapidated houses, to build a pucca house.
    benefits: >-
      Rs 1.20 lakh in plain areas (Rs 1.30 lakh in hilly and difficult areas)
      towards building a pucca house, plus unskilled wage days under MGNREGA.
    required_documents:
      - Aadhaar card
      - Bank account details
      - MGNREGA job card
    application_steps:
      - Beneficiaries are selected from the Awaas+ / SECC lists, verified by the Gram Sabha.
      - Contact your Gram Panchayat or Block Development Office to check whether your family is on the list.
      - If selected, the assistance is paid in instalments to your bank account as construction progresses.
    application_mode: Gram Panchayat / Block office
    official_url: https://pmayg.nic.in/
    category_tags: [housing, rural]
    keywords: [house, housing, home, awas, pmay, ਘਰ, ਮਕਾਨ, ਆਵਾਸ, ਪੱਕਾ ਘਰ]
    conditions:
      - field: area
        operator: eq
        value: rural
        description: You live in a rural area (village).
      - field: owns_pucca_house
        operator: eq
        value: false
        description: Your family does not own a pucca house.
      - field: in_beneficiary_list
        operator: eq
        value: true
        description: >-
          Your family is on the Awaas+ / SECC beneficiary list verified by the
          Gram Sabha.

  - slug: ab-pmjay
    name: Ayushman Bharat - Pradhan Mantri Jan Arogya Yojana
    short_name: AB PM-JAY
    name_pa: ਆਯੁਸ਼ਮਾਨ ਭਾਰਤ - ਪ੍ਰਧਾਨ ਮੰਤਰੀ ਜਨ ਆਰੋਗਿਆ ਯੋਜਨਾ
    department: HEALTH
    level: central
    description: >-
      Free (cashless) hospital treatment for eligible families at empanelled
      government and private hospitals.
    benefits: >-
      Health cover of up to Rs 5 lakh per family per year for hospital
      treatment, cashless at empanelled hospitals.
    required_documents:
      - Aadhaar card
      - Ration card
    application_steps:
      - Check whether your family is eligible on the beneficiary portal or by calling the helpline.
      - Get your Ayushman card made at a Common Service Centre or at the Ayushman desk of an empanelled hospital.
      - Show the card at an empanelled hospital for cashless treatment.
    application_mode: online check, CSC or hospital
    official_url: https://beneficiary.nha.gov.in/
    contact: Ayushman Bharat helpline 14555
    category_tags: [health, insurance]
    keywords: [health, hospital, insurance, treatment, ayushman, ਸਿਹਤ, ਹਸਪਤਾਲ, ਇਲਾਜ, ਆਯੁਸ਼ਮਾਨ]
    conditions:
      - field: in_beneficiary_list
        operator: eq
        value: true
        group: eligibility
        description: >-
          Your family is in the eligible beneficiary list (SECC 2011 or the
          state's extended list).
      - field: age
        operator: gte
        value: 70
        group: eligibility
        description: >-
          Or: you are aged 70 or above (covered regardless of income).

  - slug: ignoaps
    name: Indira Gandhi National Old Age Pension Scheme
    short_name: IGNOAPS
    name_pa: ਇੰਦਰਾ ਗਾਂਧੀ ਰਾਸ਼ਟਰੀ ਬੁਢਾਪਾ ਪੈਨਸ਼ਨ ਯੋਜਨਾ
    department: RURAL_DEVELOPMENT
    level: central
    description: >-
      Monthly pension for elderly people from below-poverty-line households,
      under the National Social Assistance Programme.
    benefits: >-
      Central share of Rs 200 per month (age 60-79) and Rs 500 per month (age
      80 and above). State governments add their own amount, so the total paid
      depends on your state.
    required_documents:
      - Age proof (Aadhaar card or birth certificate)
      - BPL card or proof of BPL status
      - Bank account details
    application_steps:
      - Apply at your Gram Panchayat (rural) or municipal office (urban), or the district social welfare office.
      - Submit the application form with age proof, BPL proof and bank details.
      - After verification, the pension is paid monthly into your bank account.
    application_mode: Gram Panchayat / municipal / social welfare office
    official_url: https://nsap.nic.in/
    category_tags: [pension, elderly]
    keywords: [pension, old age, elderly, senior, ਪੈਨਸ਼ਨ, ਬੁਢਾਪਾ, ਬਜ਼ੁਰਗ]
    conditions:
      - field: age
        operator: gte
        value: 60
        description: You are 60 years of age or older.
      - field: bpl
        operator: eq
        value: true
        description: Your household is below the poverty line (BPL).

  - slug: pmuy
    name: Pradhan Mantri Ujjwala Yojana
    short_name: PMUY
    name_pa: ਪ੍ਰਧਾਨ ਮੰਤਰੀ ਉੱਜਵਲਾ ਯੋਜਨਾ
    department: PETROLEUM
    level: central
    description: >-
      Deposit-free LPG cooking gas connection for women from poor households.
    benefits: >-
      A deposit-free LPG connection in the name of an adult woman of the
      household.
    required_documents:
      - Aadhaar card
      - Ration card
      - Bank account details
    application_steps:
      - Apply online on the PMUY portal, or visit your nearest LPG distributor.
      - Submit the KYC form with Aadhaar, ration card and bank details.
      - After verification, the distributor releases the connection.
    application_mode: online or LPG distributor
    official_url: https://www.pmuy.gov.in/
    category_tags: [household, women]
    keywords: [lpg, gas, cylinder, ujjwala, cooking, ਗੈਸ, ਸਿਲੰਡਰ, ਉੱਜਵਲਾ]
    conditions:
      - field: gender
        operator: eq
        value: female
        description: The applicant is a woman.
      - field: age
        operator: gte
        value: 18
        description: The applicant is 18 years or older.
      - field: household_has_lpg
        operator: eq
        value: false
        description: No one in the household already has an LPG connection.
      - field: poor_household
        operator: eq
        value: true
        description: >-
          The household is poor (for example SC/ST, Antyodaya ration card,
          PMAY-G beneficiary, or another listed category).

  - slug: post-matric-sc
    name: Post Matric Scholarship for Scheduled Caste Students
    short_name: PMS-SC
    name_pa: ਅਨੁਸੂਚਿਤ ਜਾਤੀ ਵਿਦਿਆਰਥੀਆਂ ਲਈ ਪੋਸਟ ਮੈਟ੍ਰਿਕ ਵਜ਼ੀਫ਼ਾ
    department: SOCIAL_JUSTICE
    level: central
    description: >-
      Scholarship for Scheduled Caste students studying after Class 10,
      covering fees and a maintenance allowance.
    benefits: >-
      Compulsory fees paid and a maintenance allowance for students in Class 11
      onwards, including college and professional courses.
    required_documents:
      - Caste certificate (SC)
      - Family income certificate
      - Previous class marksheet
      - Aadhaar-linked bank account details
    application_steps:
      - Apply on your state's scholarship portal or the National Scholarship Portal during the application window.
      - Upload your caste certificate, income certificate and marksheet.
      - Your institute verifies the application, then the state approves it.
    application_mode: online
    official_url: https://scholarships.gov.in/
    category_tags: [education, scholarship]
    keywords: [scholarship, student, college, education, sc, ਵਜ਼ੀਫ਼ਾ, ਵਿਦਿਆਰਥੀ, ਪੜ੍ਹਾਈ]
    conditions:
      - field: social_category
        operator: eq
        value: sc
        description: You belong to a Scheduled Caste (SC).
      - field: income_band
        operator: in
        value: [below_1l, 1l_to_2.5l]
        description: Your family's annual income is Rs 2.5 lakh or less.
      - field: studying_post_matric
        operator: eq
        value: true
        description: You are studying in Class 11 or above (after Class 10).

  # ---------------------------------------------------------------------------
  # Punjab state schemes. Sources: the department's own pages, and the Punjab
  # Social Justice department's 2026 schemes brochure (welfare.punjab.gov.in).
  # ---------------------------------------------------------------------------

  - slug: pb-old-age-pension
    name: Old Age Pension (Punjab)
    short_name: Punjab Budhapa Pension
    name_pa: ਬੁਢਾਪਾ ਪੈਨਸ਼ਨ (ਪੰਜਾਬ)
    department: PB_SOCIAL
    level: state
    state_code: PB
    description: >-
      Monthly pension from the Punjab Government for elderly people with low
      income: women aged 58 and above and men aged 65 and above.
    benefits: Rs 1,500 per month, paid into your bank account.
    required_documents:
      - "Age proof: Aadhaar card, voter card, matriculation certificate or birth certificate"
      - Bank account details
      - Self-declaration of income and land
    application_steps:
      - Apply at a Sewa Kendra, the District Social Security Officer (DSSO), Child Development Project Officer (CDPO), SDM office, BDPO office, Anganwadi centre or your Panchayat.
      - The Patwari (village) or the Municipal Committee (town) verifies your land, property and residence.
      - The DSSO sanctions the pension; it is then paid monthly through your bank.
    application_mode: Sewa Kendra / DSSO / Anganwadi / Panchayat
    official_url: https://sswcd.punjab.gov.in/
    source_name: Department of Social Security, Women & Child Development, Punjab
    source_url: https://sswcd.punjab.gov.in/en/node/5520
    category_tags: [pension, elderly]
    keywords: [old age pension, budhapa pension, senior citizen, elderly, ਬੁਢਾਪਾ ਪੈਨਸ਼ਨ, ਪੈਨਸ਼ਨ, ਬਜ਼ੁਰਗ]
    conditions:
      - field: woman_aged_58_plus
        operator: eq
        value: true
        group: age_rule
        description: You are a woman aged 58 or above.
      - field: man_aged_65_plus
        operator: eq
        value: true
        group: age_rule
        description: Or you are a man aged 65 or above.
      - field: annual_income_rupees
        operator: lte
        value: 60000
        description: >-
          Your total annual income, including business, rent or interest, is
          Rs 60,000 or less.
      - field: land_holding_acres
        operator: lte
        value: 2.5
        description: >-
          You and your spouse together own less than 2.5 acres of irrigated
          (nehri/chahi) land, or not more than 5 acres of barani or waterlogged land.
      - field: employed_or_taxpayer
        operator: eq
        value: false
        description: >-
          You are not in a government or private job, and you do not pay income
          tax or professional tax.

  - slug: pb-widow-destitute-women
    name: Financial Assistance to Widows and Destitute Women (Punjab)
    name_pa: ਵਿਧਵਾ ਅਤੇ ਬੇਸਹਾਰਾ ਔਰਤਾਂ ਲਈ ਵਿੱਤੀ ਸਹਾਇਤਾ (ਪੰਜਾਬ)
    department: PB_SOCIAL
    level: state
    state_code: PB
    description: >-
      Monthly financial help from the Punjab Government for widows and destitute
      women below 58, and unmarried women above 30, with low income.
    benefits: Rs 1,500 per month, paid into your bank account.
    required_documents:
      - "Age proof: Aadhaar card, voter card, matriculation certificate or birth certificate"
      - Bank account details
      - Self-declaration of income
    application_steps:
      - Apply at a Sewa Kendra, the District Social Security Officer (DSSO), CDPO, SDM office, BDPO office, Anganwadi centre or your Panchayat.
      - Your residence and income are verified (Patwari in villages, Municipal Committee in towns).
      - The DSSO sanctions the assistance; it is then paid monthly through your bank.
    application_mode: Sewa Kendra / DSSO / Anganwadi / Panchayat
    official_url: https://sswcd.punjab.gov.in/
    source_name: Department of Social Security, Women & Child Development, Punjab
    source_url: https://sswcd.punjab.gov.in/en/node/5520
    category_tags: [pension, women]
    keywords: [widow pension, vidhwa pension, destitute women, ਵਿਧਵਾ ਪੈਨਸ਼ਨ, ਵਿਧਵਾ, ਬੇਸਹਾਰਾ ਔਰਤ]
    conditions:
      - field: gender
        operator: eq
        value: female
        description: The applicant is a woman.
      - field: marital_status
        operator: in
        value: [widowed, separated, divorced]
        group: situation
        description: You are a widow or a destitute woman, below 58 years of age.
      - field: marital_status
        operator: eq
        value: single
        group: situation
        description: Or you are an unmarried woman above 30 years of age.
      - field: annual_income_rupees
        operator: lte
        value: 60000
        description: >-
          Your total annual income, including business, rent or interest, is
          Rs 60,000 or less.

  - slug: pb-dependent-children
    name: Financial Assistance to Dependent Children (Punjab)
    name_pa: ਆਸ਼ਰਿਤ ਬੱਚਿਆਂ ਲਈ ਵਿੱਤੀ ਸਹਾਇਤਾ (ਪੰਜਾਬ)
    department: PB_SOCIAL
    level: state
    state_code: PB
    description: >-
      Monthly help for children below 21 whose mother or father (or both) has
      died, is regularly absent from home, or is physically or mentally unable
      to look after the family.
    benefits: >-
      Rs 1,500 per month. If a parent dies, a near relative is named guardian
      and the help continues without a fresh application.
    required_documents:
      - "Child's age proof: Aadhaar card or birth certificate"
      - Death certificate of the parent, or proof of the parent's absence or incapacity
      - Bank account details
    application_steps:
      - Apply at a Sewa Kendra, the District Social Security Officer (DSSO), CDPO, SDM office, Anganwadi centre or your Panchayat.
      - The application is verified, then sanctioned by the DSSO.
      - The amount is paid monthly through the bank.
    application_mode: Sewa Kendra / DSSO / Anganwadi / Panchayat
    official_url: https://sswcd.punjab.gov.in/
    source_name: Department of Social Security, Women & Child Development, Punjab
    source_url: https://sswcd.punjab.gov.in/en/node/5520
    category_tags: [children, pension]
    keywords: [orphan, dependent children, single parent child, ਅਨਾਥ, ਆਸ਼ਰਿਤ ਬੱਚੇ, ਬੱਚਿਆਂ ਲਈ ਸਹਾਇਤਾ]
    conditions:
      - field: child_age
        operator: lt
        value: 21
        description: The child is below 21 years of age.
      - field: parent_dead_absent_or_incapable
        operator: eq
        value: true
        description: >-
          The child's mother, father or both have died, are regularly absent
          from home, or are physically or mentally unable to care for the family.
      - field: annual_income_rupees
        operator: lte
        value: 60000
        description: The family's total annual income is Rs 60,000 or less.

  - slug: pb-disability-assistance
    name: Financial Assistance to Persons with Disabilities (Punjab)
    name_pa: ਦਿਵਿਆਂਗ ਵਿਅਕਤੀਆਂ ਲਈ ਵਿੱਤੀ ਸਹਾਇਤਾ (ਪੰਜਾਬ)
    department: PB_SOCIAL
    level: state
    state_code: PB
    description: >-
      Monthly help for blind, physically disabled, deaf and mute, and mentally
      disabled persons who cannot earn a living.
    benefits: Rs 1,500 per month, paid into your bank account.
    required_documents:
      - Disability certificate
      - "Age proof: Aadhaar card, voter card or birth certificate"
      - Bank account details
    application_steps:
      - Apply at a Sewa Kendra, the District Social Security Officer (DSSO), CDPO, SDM office, Anganwadi centre or your Panchayat.
      - The application is verified, then sanctioned by the DSSO.
      - The amount is paid monthly through the bank.
    application_mode: Sewa Kendra / DSSO / Anganwadi / Panchayat
    official_url: https://sswcd.punjab.gov.in/
    source_name: Department of Social Security, Women & Child Development, Punjab
    source_url: https://sswcd.punjab.gov.in/en/node/5520
    category_tags: [disability, pension]
    keywords: [disability pension, handicapped, viklang, divyang, blind, deaf, ਅਪੰਗ, ਦਿਵਿਆਂਗ, ਅੰਗਹੀਣ ਪੈਨਸ਼ਨ]
    conditions:
      - field: disability_percent
        operator: gte
        value: 50
        description: >-
          You have a physical disability of 50% or more (mentally disabled
          persons are eligible at any level).
      - field: annual_income_rupees
        operator: lte
        value: 60000
        description: Your total annual income is Rs 60,000 or less.

  - slug: pb-ashirwad
