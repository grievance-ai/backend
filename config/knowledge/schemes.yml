    name_pa: ਡਾ. ਅੰਬੇਡਕਰ ਇੰਸਟੀਚਿਊਟ ਆਫ ਕਰੀਅਰਜ਼ ਐਂਡ ਕੋਰਸਿਜ਼, ਮੋਹਾਲੀ ਵਿਖੇ ਮੁਫ਼ਤ ਕੋਚਿੰਗ
