    official_url: https://maandhan.in/
    source_name: Press Information Bureau, Government of India
    source_url: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2053142
    category_tags: [pension, agriculture]
    keywords: [farmer pension, kisan pension, maandhan, ਕਿਸਾਨ ਪੈਨਸ਼ਨ, ਕਿਸਾਨ, ਪੈਨਸ਼ਨ]
    conditions:
      - field: occupation
        operator: eq
        value: farmer
        description: You are a farmer.
      - field: land_holding_acres
        operator: lte
        value: 4.94
        description: Your cultivable land is up to 2 hectares (about 4.94 acres).
      - field: age
        operator: gte
        value: 18
        description: You are 18 or older.
      - field: age
        operator: lte
        value: 40
        description: You are 40 or younger when you join.
      - field: in_land_records_2019
        operator: eq
        value: true
        description: Your name was in the state land records as on 1 August 2019.

  - slug: pmfby
    name: Pradhan Mantri Fasal Bima Yojana
    short_name: PMFBY
    name_pa: ਪ੍ਰਧਾਨ ਮੰਤਰੀ ਫ਼ਸਲ ਬੀਮਾ ਯੋਜਨਾ
    department: AGRICULTURE
    level: central
    description: >-
      Crop insurance at a low premium against crop loss from natural
      calamities, pests and diseases.
    benefits: >-
      The farmer pays at most 2% of the sum insured for kharif crops, 1.5% for
      rabi food and oilseed crops, and 5% for commercial and horticulture
      crops. The government pays the rest of the premium.
    required_documents:
      - Aadhaar card
      - Land records or tenancy agreement
      - Sowing certificate
      - Bank account details
    application_steps:
      - Enrol before the season's cut-off date through your bank, a Common Service Centre (CSC), the insurance company, or the PMFBY portal.
      - Report crop loss quickly to the insurance company or helpline.
    application_mode: bank / CSC / online
    official_url: https://pmfby.gov.in/
    source_name: Press Information Bureau, Government of India
    source_url: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2237736
    category_tags: [agriculture, insurance]
    keywords: [crop insurance, fasal bima, crop loss, ਫ਼ਸਲ ਬੀਮਾ, ਫ਼ਸਲ, ਨੁਕਸਾਨ]
    conditions:
      - field: occupation
        operator: eq
        value: farmer
        description: You are a farmer (owner or tenant) growing a notified crop in a notified area.

  - slug: kcc
    name: Kisan Credit Card (with interest subvention)
    short_name: KCC
    name_pa: ਕਿਸਾਨ ਕ੍ਰੈਡਿਟ ਕਾਰਡ
    department: AGRICULTURE
    level: central
    description: >-
      Short-term crop loans for farmers through a Kisan Credit Card, including
      for animal husbandry and fisheries.
    benefits: >-
      Loans at 7% interest; repay on time and get a further 3% off, so the
      effective rate is 4%. The interest benefit applies to loans up to Rs 3
      lakh; Union Budget 2025-26 announced raising this to Rs 5 lakh, so
      confirm the current limit with your bank. Loans only for animal
      husbandry or fisheries get the benefit up to Rs 2 lakh.
    required_documents:
      - Aadhaar card
      - Land records
      - Bank account details
    application_steps:
      - Apply at your bank branch (commercial, regional rural or cooperative bank).
      - The bank sets your card limit based on your crops and land.
    application_mode: bank
    official_url: https://agriwelfare.gov.in/
    source_name: Press Information Bureau, Government of India
    source_url: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2131989
    category_tags: [agriculture, loan]
    keywords: [kisan credit card, kcc, crop loan, farm loan, ਕਿਸਾਨ ਕ੍ਰੈਡਿਟ ਕਾਰਡ, ਫ਼ਸਲੀ ਕਰਜ਼ਾ, ਕਰਜ਼ਾ]
    conditions:
      - field: occupation
        operator: in
        value: [farmer, dairy_farmer, fisher]
        description: You are a farmer, or in animal husbandry or fisheries.

  - slug: pm-surya-ghar
    name: PM Surya Ghar Muft Bijli Yojana
    short_name: PM Surya Ghar
    name_pa: ਪੀਐਮ ਸੂਰਿਆ ਘਰ ਮੁਫ਼ਤ ਬਿਜਲੀ ਯੋਜਨਾ
    department: MNRE
    level: central
    description: >-
      Subsidy for installing rooftop solar panels on your house, so you can get
      up to 300 units of electricity free every month.
    benefits: >-
      Central subsidy of Rs 30,000 for a 1 kW system, Rs 60,000 for 2 kW and
      Rs 78,000 for 3 kW or more. Collateral-free low-interest loans for
      systems up to 3 kW.
    required_documents:
      - Recent electricity bill
      - Aadhaar card
      - Bank account details
    application_steps:
      - Register on the national rooftop solar portal with your electricity connection details.
      - Choose a registered vendor and get the panels installed.
      - After inspection and net-meter installation, the subsidy is paid into your bank account.
    application_mode: online
    official_url: https://pmsuryaghar.gov.in/
    source_name: Press Information Bureau, Government of India
    source_url: https://www.pib.gov.in/Pressreleaseshare.aspx?PRID=2010130
    category_tags: [electricity, solar, household]
    keywords: [solar panel, rooftop solar, free electricity, bijli, ਸੋਲਰ, ਮੁਫ਼ਤ ਬਿਜਲੀ, ਬਿਜਲੀ]
    conditions:
      - field: owns_house_with_roof
        operator: eq
        value: true
        description: You own a house with a roof suitable for solar panels.
      - field: has_electricity_connection
        operator: eq
        value: true
        description: The house has an electricity connection in your name.

  - slug: pmay-u-2
    name: Pradhan Mantri Awas Yojana - Urban 2.0
    short_name: PMAY-U 2.0
    name_pa: ਪ੍ਰਧਾਨ ਮੰਤਰੀ ਆਵਾਸ ਯੋਜਨਾ - ਸ਼ਹਿਰੀ 2.0
    department: HOUSING_URBAN
    level: central
    description: >-
      Help for urban families without a pucca house to build or buy one.
    benefits: >-
      Up to Rs 2.5 lakh to build a house on your own land (economically weaker
      section families), or a 4% interest subsidy on a home loan, up to Rs 1.80
      lakh paid in five yearly instalments (loans sanctioned from 1 September
      2024).
    required_documents:
      - Aadhaar card of family members
      - Income certificate
      - Bank account details
      - Land documents (for building on your own land)
    application_steps:
      - Apply online on the PMAY-Urban portal, or through your municipal office.
      - The application is verified and approved by the state.
    application_mode: online or municipal office
    official_url: https://pmay-urban.gov.in/
    source_name: Press Information Bureau, Government of India
    source_url: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2043927
    category_tags: [housing, urban]
    keywords: [house, home loan, urban housing, awas, pmay, ਘਰ, ਮਕਾਨ, ਸ਼ਹਿਰੀ ਆਵਾਸ]
    conditions:
      - field: area
        operator: eq
        value: urban
        description: You live in a city or town.
      - field: owns_pucca_house
        operator: eq
        value: false
        description: Your family (husband, wife, unmarried children) has no pucca house anywhere in India.
      - field: income_band
        operator: not_in
        value: [above_10l]
        description: >-
          Your family's annual income is up to Rs 9 lakh (EWS up to Rs 3 lakh,
          LIG Rs 3-6 lakh, MIG Rs 6-9 lakh).

  - slug: ignwps
    name: Indira Gandhi National Widow Pension Scheme
    short_name: IGNWPS
    name_pa: ਇੰਦਰਾ ਗਾਂਧੀ ਰਾਸ਼ਟਰੀ ਵਿਧਵਾ ਪੈਨਸ਼ਨ ਯੋਜਨਾ
    department: RURAL_DEVELOPMENT
    level: central
    description: >-
      Monthly pension for widows from below-poverty-line households, under the
      National Social Assistance Programme.
    benefits: >-
      Central share of Rs 300 per month (Rs 500 from age 80). States add their
      own amount; in Punjab see also the state's assistance for widows.
    required_documents:
      - Husband's death certificate
      - Age proof
      - BPL proof
      - Bank account details
    application_steps:
      - Apply at your Gram Panchayat, municipal office or the district social welfare office.
      - After verification, the pension is paid monthly into your bank account.
    application_mode: Gram Panchayat / municipal / social welfare office
    official_url: https://nsap.nic.in/
    source_name: Press Information Bureau, Government of India
    source_url: https://www.pib.gov.in/PressNoteDetails.aspx?ModuleId=3&NoteId=155928
    category_tags: [pension, women]
    keywords: [widow pension, vidhwa, ਵਿਧਵਾ ਪੈਨਸ਼ਨ, ਵਿਧਵਾ]
    conditions:
      - field: marital_status
        operator: eq
        value: widowed
        description: You are a widow.
      - field: age
        operator: gte
        value: 40
        description: You are 40 or older.
      - field: bpl
        operator: eq
        value: true
        description: Your household is below the poverty line (BPL).

  - slug: igndps
    name: Indira Gandhi National Disability Pension Scheme
    short_name: IGNDPS
    name_pa: ਇੰਦਰਾ ਗਾਂਧੀ ਰਾਸ਼ਟਰੀ ਦਿਵਿਆਂਗਤਾ ਪੈਨਸ਼ਨ ਯੋਜਨਾ
    department: RURAL_DEVELOPMENT
    level: central
    description: >-
      Monthly pension for people with severe or multiple disabilities from
      below-poverty-line households.
    benefits: >-
      Central share of Rs 300 per month (Rs 500 from age 80). States add their
      own amount; in Punjab see also the state's assistance for persons with
      disabilities.
    required_documents:
      - Disability certificate
      - Age proof
      - BPL proof
      - Bank account details
    application_steps:
      - Apply at your Gram Panchayat, municipal office or the district social welfare office.
      - After verification, the pension is paid monthly into your bank account.
    application_mode: Gram Panchayat / municipal / social welfare office
    official_url: https://nsap.nic.in/
    source_name: Press Information Bureau, Government of India
    source_url: https://www.pib.gov.in/PressNoteDetails.aspx?ModuleId=3&NoteId=155928
    category_tags: [pension, disability]
    keywords: [disability pension, divyang, viklang, ਦਿਵਿਆਂਗ ਪੈਨਸ਼ਨ, ਅਪੰਗ]
    conditions:
      - field: severe_disability
        operator: eq
        value: true
        description: You have a severe or multiple disability.
      - field: age
        operator: gte
        value: 18
        description: You are 18 or older.
      - field: bpl
        operator: eq
        value: true
        description: Your household is below the poverty line (BPL).

  - slug: nfbs
    name: National Family Benefit Scheme
    short_name: NFBS
    name_pa: ਰਾਸ਼ਟਰੀ ਪਰਿਵਾਰ ਲਾਭ ਯੋਜਨਾ
    department: RURAL_DEVELOPMENT
    level: central
    description: >-
      One-time help for a poor family when its main earning member dies.
    benefits: A lump sum of Rs 20,000 to the family.
    required_documents:
      - Death certificate of the earning member
      - Age proof of the deceased
      - BPL proof
      - Bank account details of the applicant
    application_steps:
      - Apply at your Gram Panchayat, municipal office or the district social welfare office.
      - After verification, the amount is paid into the bank account of the family member who applied.
    application_mode: Gram Panchayat / municipal / social welfare office
    official_url: https://nsap.nic.in/
    source_name: Press Information Bureau, Government of India
    source_url: https://www.pib.gov.in/PressNoteDetails.aspx?ModuleId=3&NoteId=155928
    category_tags: [family, death-assistance]
    keywords: [death of breadwinner, family benefit, earning member died, ਪਰਿਵਾਰ ਲਾਭ, ਮੌਤ, ਕਮਾਊ ਮੈਂਬਰ]
    conditions:
      - field: breadwinner_died
        operator: eq
        value: true
        description: The family's main earning member has died, aged between 18 and 59.
      - field: bpl
        operator: eq
        value: true
        description: The household is below the poverty line (BPL).

  - slug: pmmvy
    name: Pradhan Mantri Matru Vandana Yojana
    short_name: PMMVY
    name_pa: ਪ੍ਰਧਾਨ ਮੰਤਰੀ ਮਾਤ੍ਰ ਵੰਦਨਾ ਯੋਜਨਾ
    department: WCD
    level: central
    description: >-
      Cash help for pregnant women and new mothers from disadvantaged
      backgrounds, for the first child and for a second child if it is a girl.
    benefits: >-
      Rs 5,000 in two instalments for the first child; Rs 6,000 in one
      instalment after the birth of a second child who is a girl. Paid into
      your bank or post office account.
    required_documents:
      - Aadhaar card
      - Mother and Child Protection (MCP) card
      - Bank or post office account details
    application_steps:
      - Register through your Anganwadi worker or ASHA, or on the PMMVY portal.
      - The instalments are paid after the required health check-ups and, for the second girl child, after the birth.
    application_mode: Anganwadi / ASHA / online
    official_url: https://pmmvy.wcd.gov.in/
    source_name: Press Information Bureau, Government of India
    source_url: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2270668
    category_tags: [women, maternity, health]
    keywords: [pregnancy, pregnant, maternity benefit, mother, ਗਰਭਵਤੀ, ਜਣੇਪਾ, ਮਾਂ]
    conditions:
      - field: gender
        operator: eq
        value: female
        description: The applicant is a woman.
      - field: pregnant_or_new_mother
        operator: eq
        value: true
        description: You are pregnant or recently gave birth (first child, or a second child who is a girl).
      - field: govt_or_psu_employee
        operator: eq
        value: false
        description: You are not in regular employment with the Central or State Government or a public sector undertaking.

  - slug: jsy
    name: Janani Suraksha Yojana
    short_name: JSY
    name_pa: ਜਨਨੀ ਸੁਰੱਖਿਆ ਯੋਜਨਾ
    department: HEALTH_FW
    level: central
    description: >-
      Cash help for safe delivery in a hospital, under the National Health
      Mission.
    benefits: >-
      In Punjab: Rs 700 (rural) or Rs 600 (urban) for delivery in a government
      hospital or accredited private hospital. Rs 500 for a home delivery
      (BPL women aged 19 and above). Paid into your Aadhaar-linked bank
      account.
    required_documents:
      - Aadhaar-linked bank account
      - BPL or SC/ST certificate
      - Mother and Child Protection (MCP) card
    application_steps:
      - Register your pregnancy with your ASHA worker or at a government health centre.
      - Deliver at a government or accredited hospital; the amount is paid after delivery.
    application_mode: ASHA / government health centre
    official_url: https://nhm.gov.in/
    source_name: National Health Mission, Ministry of Health & Family Welfare
    source_url: https://nhm.gov.in/index1.php?lang=1&level=3&lid=309&sublinkid=841
    category_tags: [women, maternity, health]
    keywords: [delivery, institutional delivery, pregnancy, janani suraksha, ਜਣੇਪਾ, ਡਿਲੀਵਰੀ, ਗਰਭਵਤੀ]
    conditions:
      - field: gender
        operator: eq
        value: female
        description: The applicant is a pregnant woman.
      - field: social_category
        operator: in
        value: [sc, st]
        group: poverty
        description: You are Scheduled Caste or Scheduled Tribe.
      - field: bpl
        operator: eq
        value: true
        group: poverty
        description: Or your household is below the poverty line (BPL).

  - slug: pmgkay
    name: Free Foodgrains under PM Garib Kalyan Anna Yojana (NFSA)
    short_name: PMGKAY
    name_pa: ਪ੍ਰਧਾਨ ਮੰਤਰੀ ਗ਼ਰੀਬ ਕਲਿਆਣ ਅੰਨ ਯੋਜਨਾ (ਮੁਫ਼ਤ ਰਾਸ਼ਨ)
    department: FOOD
    level: central
    description: >-
      Free foodgrains every month for ration card holders under the National
      Food Security Act, for five years from 1 January 2024.
    benefits: >-
      Free foodgrains: 35 kg per month per Antyodaya (AAY) household, and 5 kg
      per person per month for priority households.
    required_documents:
      - Ration card (NFSA, Antyodaya or priority household)
      - Aadhaar card
    application_steps:
      - Collect your grain from your fair price (ration) shop with your ration card.
      - To get a ration card, apply at your district Food & Civil Supplies office.
    application_mode: ration shop
    official_url: https://dfpd.gov.in/
    source_name: Press Information Bureau, Government of India
    source_url: https://www.pib.gov.in/PressReleasePage.aspx?PRID=1980689
    category_tags: [food, ration]
    keywords: [ration, free ration, wheat, atta, food grain, depot, ਰਾਸ਼ਨ, ਮੁਫ਼ਤ ਰਾਸ਼ਨ, ਕਣਕ, ਡਿਪੂ]
    conditions:
      - field: nfsa_ration_card
        operator: eq
        value: true
        description: Your family has an NFSA ration card (Antyodaya or priority household).

  - slug: e-shram
    name: e-Shram Card (National Database of Unorganised Workers)
    short_name: e-Shram
    name_pa: ਈ-ਸ਼੍ਰਮ ਕਾਰਡ
    department: LABOUR
    level: central
    description: >-
      Free registration for unorganised workers, giving a Universal Account
      Number (e-Shram card) used to reach social security schemes.
    benefits: >-
      An e-Shram card with a Universal Account Number; registered workers can
      be linked to social security and welfare schemes. Registration is free.
    required_documents:
      - Aadhaar card
      - Mobile number (preferably linked to Aadhaar)
      - Bank account details
    application_steps:
      - Register yourself on the e-Shram portal, through the UMANG app, or at a Common Service Centre (CSC).
    application_mode: online / UMANG / CSC
    official_url: https://eshram.gov.in/
    source_name: Press Information Bureau, Government of India
    source_url: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2086193
    category_tags: [workers, registration]
    keywords: [eshram, labour card, mazdoor card, unorganised worker, ਈ-ਸ਼੍ਰਮ, ਮਜ਼ਦੂਰ ਕਾਰਡ, ਕਿਰਤੀ]
    conditions:
      - field: unorganised_worker
        operator: eq
        value: true
        description: You work in the unorganised sector (wage, home-based or self-employed).
      - field: age
        operator: gte
        value: 16
        description: You are 16 or older.
      - field: epfo_esic_member_or_taxpayer
        operator: eq
        value: false
        description: You are not an EPFO or ESIC member and do not pay income tax.

  - slug: vb-g-ram-g
    name: Viksit Bharat Guarantee for Rozgar and Ajeevika Mission (Gramin)
    short_name: VB-G RAM G
    name_pa: ਵਿਕਸਿਤ ਭਾਰਤ ਰੁਜ਼ਗਾਰ ਅਤੇ ਆਜੀਵਿਕਾ ਗਾਰੰਟੀ ਮਿਸ਼ਨ (ਗ੍ਰਾਮੀਣ)
    department: RURAL_DEVELOPMENT
    level: central
    description: >-
      Guaranteed paid work for rural households whose adult members want
      unskilled manual work. It replaced MGNREGA from 1 July 2026.
    benefits: >-
      Up to 125 days of paid work per household per year. Work must be given
      within 15 days of asking, or an unemployment allowance is paid. Wages are
      paid weekly, at the latest within 15 days. States may pause work for up
      to 60 days a year in the peak farming season.
    required_documents:
      - Job card (MGNREGA job cards with completed e-KYC stay valid until new Gramin Rozgar Guarantee Cards are issued)
      - Aadhaar card
      - Bank account details
    application_steps:
      - Apply for work at your Gram Panchayat.
      - Work should be given within 15 days; if not, you can claim the unemployment allowance.
    application_mode: Gram Panchayat
    official_url: https://rural.gov.in/
    source_name: Press Information Bureau, Government of India
    source_url: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2241357
    category_tags: [employment, rural]
    keywords: [nrega, mgnrega, narega, job card, rozgar, rural job, ਨਰੇਗਾ, ਮਨਰੇਗਾ, ਰੁਜ਼ਗਾਰ, ਜੌਬ ਕਾਰਡ, ਦਿਹਾੜੀ]
    conditions:
      - field: area
        operator: eq
        value: rural
        description: You live in a rural area (village).
      - field: age
        operator: gte
        value: 18
        description: You are an adult willing to do unskilled manual work.

  - slug: pm-yasasvi-pre-matric-obc
    name: PM-YASASVI Pre-Matric Scholarship for OBC, EBC and DNT Students
    name_pa: ਪੀਐਮ-ਯਸ਼ਸਵੀ ਪ੍ਰੀ-ਮੈਟ੍ਰਿਕ ਵਜ਼ੀਫ਼ਾ (ਓਬੀਸੀ, ਈਬੀਸੀ, ਡੀਐਨਟੀ)
    department: SOCIAL_JUSTICE
    level: central
    description: >-
      Scholarship for Backward Class, economically backward and denotified
      tribe students in Classes 9 and 10 at government schools.
    benefits: Rs 4,000 per year as academic allowance.
    required_documents:
      - Caste certificate
      - Income certificate
      - Aadhaar-linked bank account
    application_steps:
      - Apply through your school as per the Punjab scholarship schedule.
    application_mode: through school
    official_url: https://scholarships.punjab.gov.in/
    source_name: Department of Social Justice, Empowerment & Minorities, Punjab (schemes brochure 2026)
    source_url: https://welfare.punjab.gov.in/Static/PDF/Publications/SJEMPUNJAB.pdf
    category_tags: [education, scholarship]
    keywords: [scholarship, obc scholarship, class 9, class 10, ਵਜ਼ੀਫ਼ਾ, ਪਛੜੀਆਂ ਸ਼੍ਰੇਣੀਆਂ]
    conditions:
      - field: social_category
        operator: eq
        value: obc
        description: The student is OBC, EBC or DNT.
      - field: income_band
        operator: in
        value: [below_1l, 1l_to_2.5l]
        description: The parents' annual income is Rs 2.5 lakh or less.
      - field: studying_class_9_or_10_govt_school
        operator: eq
        value: true
        description: The student is in Class 9 or 10 at a government school and gets no other scholarship.

  - slug: post-matric-obc
    name: Post Matric Scholarship for OBC, EBC and DNT Students (Punjab)
    name_pa: ਓਬੀਸੀ, ਈਬੀਸੀ ਅਤੇ ਡੀਐਨਟੀ ਵਿਦਿਆਰਥੀਆਂ ਲਈ ਪੋਸਟ ਮੈਟ੍ਰਿਕ ਵਜ਼ੀਫ਼ਾ
    department: SOCIAL_JUSTICE
    level: central
    description: >-
      Scholarship for Backward Class, economically backward and denotified
      tribe students of Punjab studying after Class 10, from government or
      private institutions in India.
    benefits: >-
      Yearly support by course group: degree/postgraduate professional courses
      Rs 20,000 (Rs 10,000 allowance + Rs 10,000 fees); other professional
      courses Rs 13,000; other graduate and postgraduate courses Rs 8,000;
      Class 11-12 and other post-matric non-degree courses Rs 5,000. Freeship
      card at admission.
    required_documents:
      - Caste certificate
      - Income certificate
      - Residence certificate (Punjab)
      - Aadhaar-seeded bank account
    application_steps:
      - Apply on the Dr. Ambedkar Scholarship Portal (scholarships.punjab.gov.in).
      - Renewal students are paid first, then new students, depending on funds.
    application_mode: online
    official_url: https://scholarships.punjab.gov.in/
    source_name: Department of Social Justice, Empowerment & Minorities, Punjab (schemes brochure 2026)
    source_url: https://welfare.punjab.gov.in/Static/PDF/Publications/SJEMPUNJAB.pdf
