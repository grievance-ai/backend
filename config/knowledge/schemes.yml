  - slug: apy
    name: Atal Pension Yojana
    short_name: APY
    name_pa: ਅਟਲ ਪੈਨਸ਼ਨ ਯੋਜਨਾ
    department: FINANCE
    level: central
    description: >-
      A pension scheme for people aged 18 to 40: pay a small amount every month
      and get a fixed pension after 60.
    benefits: >-
      A guaranteed pension of Rs 1,000 to Rs 5,000 per month from age 60,
      depending on what you choose and your age when you join. For example,
      joining at 18 costs Rs 42 to Rs 210 a month; joining at 40 costs Rs 291
      to Rs 1,454 a month.
    required_documents:
      - Savings bank or post office account
      - Aadhaar card
      - Mobile number
    application_steps:
      - Open the APY account at your bank or post office branch, or through your bank's net banking.
      - Choose the pension amount; the monthly contribution is auto-debited.
    application_mode: bank or post office
    official_url: https://www.npscra.nsdl.co.in/scheme-details.php
    source_name: Press Information Bureau, Government of India
    source_url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/may/doc202558551701.pdf
