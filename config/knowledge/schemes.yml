  - slug: sukanya-samriddhi
    name: Sukanya Samriddhi Account
    short_name: SSA
    name_pa: ਸੁਕੰਨਿਆ ਸਮ੍ਰਿੱਧੀ ਖਾਤਾ
    department: FINANCE
    level: central
    description: >-
      A government savings account for a girl child below 10, for her education
      and marriage, with a high interest rate set by the government.
    benefits: >-
      Deposit Rs 250 to Rs 1.5 lakh a year for 15 years; the account matures 21
      years after opening. Up to 50% can be withdrawn after the girl turns 18 or
      passes Class 10. The interest rate is set by the government every quarter.
    required_documents:
      - Birth certificate of the girl
      - Identity and address proof of the parent or guardian
    application_steps:
      - Open the account at a post office or an authorised bank, with a first deposit of at least Rs 250.
      - Deposit at least Rs 250 every year for 15 years.
    application_mode: post office or bank
    official_url: https://www.nsiindia.gov.in/
    source_name: National Savings Institute (scheme rules) and Press Information Bureau
    source_url: https://www.nsiindia.gov.in/writereaddata/SchemeRules/SukanyaSamriddhiAccountSchemeRule.pdf
