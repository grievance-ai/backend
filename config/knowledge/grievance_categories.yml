# Grievance categories → the Punjab department each one is routed to.
# Loaded by: docker compose run --rm api python -m app.console seed-knowledge
#
# sla_days are PROTOTYPE ASSUMPTIONS (they set each grievance's due date), not
# official service-level commitments. Adjust them with the departments.
# A category without `department` is routed by district only.

departments:
  - code: PB_WSS
    name_en: Department of Water Supply & Sanitation, Punjab
    name_pa: ਜਲ ਸਪਲਾਈ ਅਤੇ ਸੈਨੀਟੇਸ਼ਨ ਵਿਭਾਗ, ਪੰਜਾਬ
  - code: PSPCL
    name_en: Punjab State Power Corporation Limited (PSPCL)
    name_pa: ਪੰਜਾਬ ਰਾਜ ਬਿਜਲੀ ਨਿਗਮ ਲਿਮਿਟਡ (PSPCL)
  - code: PB_PWD
    name_en: Public Works Department (B&R), Punjab
    name_pa: ਲੋਕ ਨਿਰਮਾਣ ਵਿਭਾਗ (ਭਵਨ ਤੇ ਮਾਰਗ), ਪੰਜਾਬ
  - code: PB_LG
    name_en: Department of Local Government, Punjab
    name_pa: ਸਥਾਨਕ ਸਰਕਾਰਾਂ ਵਿਭਾਗ, ਪੰਜਾਬ
  - code: PB_RDP
    name_en: Department of Rural Development & Panchayats, Punjab
    name_pa: ਪੇਂਡੂ ਵਿਕਾਸ ਅਤੇ ਪੰਚਾਇਤ ਵਿਭਾਗ, ਪੰਜਾਬ
  - code: PB_SOCIAL
    name_en: Department of Social Security, Women & Child Development, Punjab
    name_pa: ਸਮਾਜਿਕ ਸੁਰੱਖਿਆ, ਇਸਤਰੀ ਅਤੇ ਬਾਲ ਵਿਕਾਸ ਵਿਭਾਗ, ਪੰਜਾਬ
  - code: PB_FOOD
    name_en: Department of Food, Civil Supplies & Consumer Affairs, Punjab
    name_pa: ਖੁਰਾਕ, ਸਿਵਲ ਸਪਲਾਈ ਅਤੇ ਖਪਤਕਾਰ ਮਾਮਲੇ ਵਿਭਾਗ, ਪੰਜਾਬ
  - code: PB_HEALTH
    name_en: Department of Health & Family Welfare, Punjab
    name_pa: ਸਿਹਤ ਅਤੇ ਪਰਿਵਾਰ ਭਲਾਈ ਵਿਭਾਗ, ਪੰਜਾਬ
  - code: PB_EDU
    name_en: Department of School Education, Punjab
    name_pa: ਸਕੂਲ ਸਿੱਖਿਆ ਵਿਭਾਗ, ਪੰਜਾਬ
  - code: PB_REVENUE
    name_en: Department of Revenue, Rehabilitation & Disaster Management, Punjab
    name_pa: ਮਾਲ, ਮੁੜ ਵਸੇਬਾ ਅਤੇ ਆਫ਼ਤ ਪ੍ਰਬੰਧਨ ਵਿਭਾਗ, ਪੰਜਾਬ

